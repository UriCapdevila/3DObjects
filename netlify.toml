# Configuración de deploy para Netlify
# El plugin @netlify/plugin-nextjs se instala automáticamente al detectar Next.js

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Forzamos Node 20 (Next 15 lo recomienda)
  NODE_VERSION = "20"
  # Netlify a veces deshabilita el cache de npm, lo forzamos
  NPM_FLAGS = "--prefer-offline --no-audit"

# Headers para archivos 3D — DUPLICADOS aquí además de next.config.ts
# porque Netlify sirve archivos de /public/ directamente desde su CDN,
# bypaseando los headers de Next. Esta es la fuente de verdad.
[[headers]]
  for = "/models/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/models/*.usdz"
  [headers.values]
    Content-Type = "model/vnd.usdz+zip"
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/models/*.gltf"
  [headers.values]
    Content-Type = "model/gltf+json"
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Security headers básicos (también ayudan con la confianza del navegador en AR)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions necesarias para WebXR y cámara
    Permissions-Policy = "camera=(self), xr-spatial-tracking=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)"
